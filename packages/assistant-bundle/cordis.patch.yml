# @junjiangao/assistant-bundle —— 个人 AI 助理的组合补丁
#
# 这一层在 dsh-base 与 dsh-web-app 之后应用（profile 的 bundles 顺序决定），做三件事：
#   1. 摘掉**表现层**（HTTP/浏览器/桌面集成），保留功能层；
#   2. 把身份装配交给我们自己的 assistant-startup（system-prompt 的 persona 置空）；
#   3. 插入通道层（channel-core / channel-telegram）与启动器。
#
# 依据：docs/design/v4-定稿与实施计划.md §4.2（删除名单）、§4.3（必须保留）、§5（身份）。
# 修改本文件后请跑 `node deploy/gen-preset.mjs --check`：它会核对删除名单里的 row id 是否
# 仍存在于当前 DSH 安装里（DSH 升级后 id 可能改名，未命中只会告警、不会崩，所以必须主动查）。
#
# 注意：补丁是**按 id 整段替换**，不是深合并；下面重新声明的行都写全了自己拥有的键。

# ── 身份：persona 槽位留空，身份由 assistant-startup 在运行期从文件注册 ──────────
#
# dsh-web-app 把 personaPrefix 设成「You are a coding agent…」。v4 要求身份由
# $DSH_HOME/identity/{SOUL,SYSTEM}.md 决定，因此这里清空，并让 assistant-startup
# 以独立 section（deployment:* 之外的 assistant:identity-*）注册，避免同一全局层重名。
- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config:
    personaPrefix: ''

# 权限继承 dsh-base：默认 workspace-write + ask。
# 部署者可用 DSH_PERMISSION_MODE 显式选择；审批应答由 channel-core 接入。

# ── 模型：本机配置，放在 profile 层（不入库）──────────────────────────────────
#
# provider id、apiKeyEnv、网关地址与默认模型都是环境相关，不写进仓库。
# 现有部署在 $DSH_HOME/profiles/assistant/cordis.patch.yml 里配置
# llm-pi-ai / agent-default-model / subagent-model-selection-settings；
# 新环境按 README「模型」一节填写。
# base 的 llm-deepseek（DEEPSEEK_API_KEY）保留，未配置 profile 时直连官方 API。

# ── 保留 connection / file-upload，但去掉它们对 webStartup 的行级依赖 ────────────
#
# web-app 给 connection 行声明了 `inject: [webStartup]` 并用 `ctx.webStartup.trustedHosts`
# 当配置值。我们删掉 web-startup，因此必须重声明这一行：把 inject 清空、trustedHosts 取空。
# connection 自己只在 `ctx.inject(["webServer"])` 内注册 HTTP 路由，没有 webserver 时
# 它照样提供 `connection` 服务——session-controller → file-upload → connection 这条链才不断。
- id: connection
  name: '@deepseek-ai/dsh-client-connection'
  inject: []
  config:
    trustedHosts: []

# ── 会话全文检索：web-app 默认只开一个内存索引，常驻助理需要跨重启可检索 ─────────
#
# `openAt: first-search` 让 sqlite 在第一次搜索时才打开，启动依旧安静。
- id: session-query-sqlite
  name: '@deepseek-ai/dsh-session-query-sqlite'
  config:
    path: !!js "(process.env.DSH_HOME ?? ((process.env.HOME ?? '.') + '/.dsh-assistant')) + '/storages/session-query.sqlite'"
    openAt: first-search

# ── 必须保留（看着像表现层，其实是功能层）──────────────────────────────────────
#
# session-controller → file-upload → connection → credentials、workspace、schedule、
# mcp-manager、cordis-host-runner、cordis-inspect-providers、subagent-model-selection-settings、
# session-stats、session-turn-outline、deliverable-file-references 一律不动。
# 详见设计文档 §4.3。

# ── 删除名单：表现层 ────────────────────────────────────────────────────────────
# HTTP 与传输
# HTTP 传输：没有它就没有 token/cookie/端口
- id: webserver
  disabled: true

# 必须与 webserver 同批删除；它硬注入 webServer，只删一个会停在 pending 并触发 StartupError
- id: web-runtime
