# ── 调度：--once / --doctor 下不挂 ─────────────────────────────────────────────
#
# 设计文档 §9.6：一次性模式不挂 Telegram、不挂 schedule、不取 pid 锁。
# 网关之外唯一会自己「到点做事」的行就是 schedule，因此按模式门控。
#
# 门控表达式只能读**全局对象**：`disabled` 在 Loader 的启动审计阶段求值，那时行的 `inject`
# 还没生效，任何 `ctx.<service>` / `ctx.get('<service>')` 都会让该行被判为 "failed to import"。
# 因此这里直接看启动参数：`--once` / `--doctor` / `--help` 时不挂通道与调度，daemon 时挂。
# （插件内部还会用 `assistantStartup.mode` 再兜底一次，见 channel-core / channel-telegram 的 apply。）
- id: schedule
  inject: [assistantStartup]
  disabled: !!js "process.argv.some((arg) => /^--(once|doctor|help)(=|$)/.test(arg) || arg === '-o' || arg === '-h')"

# ── 通道层与启动器 ─────────────────────────────────────────────────────────────
#
# 顺序即依赖顺序：startup 先提供 assistantStartup，通道行再据此判断要不要挂。
- insert:
    # 启动器三模式：daemon / --once / --doctor。身份装配也在这里。
    - id: assistant-startup
      name: '@junjiangao/assistant-startup'

    # 通道无关的治理层。owner 白名单来自 TELEGRAM_OWNER_ID；未设置时退化为
    # 占位值 0（不匹配任何真实用户；部署里请务必显式设置）。
    - id: channel-core
      name: '@junjiangao/channel-core'
      inject: [assistantStartup]
      disabled: !!js "process.argv.some((arg) => /^--(once|doctor|help)(=|$)/.test(arg) || arg === '-o' || arg === '-h')"
      config:
        owners:
          telegram: !!js "(process.env.TELEGRAM_OWNER_ID ?? '0').split(',').map((value) => value.trim()).filter((value) => value !== '')"

    # Telegram 通道。默认占位符传输（本地 sim/inbox.jsonl）；给真实 token 即切到 Bot API。
    - id: channel-telegram
      name: '@junjiangao/channel-telegram'
      inject: [assistantStartup, channelCore]
      disabled: !!js "process.argv.some((arg) => /^--(once|doctor|help)(=|$)/.test(arg) || arg === '-o' || arg === '-h')"